<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own Your Web - Get Started</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --dark-gray: #0a0a0a;
            --medium-gray: #1a1a1a;
            --green: #00ff41;
            --green-dim: #00cc33;
            --white: #ffffff;
            --gray: #888888;
            --light-gray: #cccccc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Terminal header */
        .terminal-header {
            background: var(--dark-gray);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-prompt {
            font-family: 'JetBrains Mono', monospace;
            color: var(--green);
            font-size: 0.9rem;
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Main content */
        .container {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            color: var(--green);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        /* Form */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-family: 'JetBrains Mono', monospace;
            color: var(--green);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            color: var(--white);
            padding: 1rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border-radius: 0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(0, 255, 65, 0.1);
        }

        input::placeholder {
            color: var(--gray);
        }

        /* Submit button */
        .submit-btn {
            background: var(--black);
            border: 2px solid var(--green);
            color: var(--green);
            padding: 1rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--green);
            color: var(--black);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Success message */
        .success-message {
            display: none;
            text-align: center;
            padding: 3rem;
            border: 1px solid var(--green);
        }

        .success-message.show {
            display: block;
        }

        .signup-form.hide {
            display: none;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--medium-gray);
            color: var(--gray);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--green);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 640px) {
            .container {
                padding: 2rem 1.25rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="terminal-header">
        <div class="terminal-prompt">
            > ownyourweb@main:~$ ./signup<span class="cursor">_</span>
        </div>
        <div class="terminal-prompt" style="opacity: 0.7;">
            v1.0
        </div>
    </div>

    <div class="container">
        <!-- Form -->
        <div class="signup-form" id="signupForm">
            <h1>Get Started</h1>
            <p class="subtitle">Move from rented platforms to owned infrastructure. Tell us about your project.</p>

            <form
                action="https://formspree.io/f/YOUR_FORM_ID"
                method="POST"
                id="leadForm"
            >
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="business">Business Name</label>
                    <input
                        type="text"
                        id="business"
                        name="business"
                        placeholder="Your company or project"
                    >
                </div>

                <div class="form-group">
                    <label for="website">Current Website (optional)</label>
                    <input
                        type="url"
                        id="website"
                        name="website"
                        placeholder="https://yourcurrentsite.com"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Tell us about your project</label>
                    <input
                        type="text"
                        id="message"
                        name="message"
                        placeholder="What are you building?"
                    >
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>

        <!-- Success message -->
        <div class="success-message" id="successMessage">
            <div class="success-icon">✓</div>
            <h1 style="margin-bottom: 1rem;">Received.</h1>
            <p style="color: var(--gray);">
                We'll be in touch soon.
            </p>
        </div>
    </div>

    <div class="footer">
        <a href="https://innergclaw.github.io/ownyourweb-landing/">Own Your Web</a>
        — Your website. Your server. Your control.
    </div>

    <script>
        // Handle form submission
        const form = document.getElementById('leadForm');
        const signupForm = document.getElementById('signupForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Simulate submission (replace with actual Formspree integration)
            const formData = new FormData(form);

            // For now, just show success
            signupForm.classList.add('hide');
            successMessage.classList.add('show');

            // In production, Formspree handles this automatically
            // form.submit();
        });
    </script>
</body>
</html>
